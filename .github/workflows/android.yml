name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch sherpa-onnx native libraries (arm64)
        run: |
          curl -sSfL -o /tmp/so.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-v2.0.3-android.tar.bz2
          mkdir -p /tmp/so && tar xjf /tmp/so.tar.bz2 -C /tmp/so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp -v /tmp/so/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: Unit tests and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Name the APK
        id: apk
        run: |
          V=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)
          OUT="wizpor-${V}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=android/$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${V}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=wizpor Android ${V} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wizpor-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release (phone downloads from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
          body: |
            Install on your phone: open this page on the phone, tap the .apk below, and allow installing.
            Updates install over the top (your downloaded speech model is kept).
